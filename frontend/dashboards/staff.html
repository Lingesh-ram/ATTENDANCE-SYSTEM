<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Staff Dashboard</title>

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/staff.css">
</head>

<body>

    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <header>
        <strong>Staff Dashboard</strong>

        <button id="logout" class="danger">
            Logout
        </button>
    </header>


    <main class="container">


        <!-- ============================= -->
        <!-- COURSE & SESSION MANAGEMENT -->
        <!-- ============================= -->

        <section class="card">

            <h2>Course & Session Management</h2>

            <form id="sessionForm">

                <select id="course" required>
                    <option value="">
                        Select Class / Subject
                    </option>
                </select>

                <input
                    id="duration"
                    type="number"
                    min="1"
                    value="10"
                    placeholder="Minutes"
                    required
                >

                <button class="btn" type="submit">
                    Start Roll Call
                </button>

            </form>

            <p id="sessionMsg"></p>

        </section>



        <!-- ============================= -->
        <!-- ACTIVE SESSIONS -->
        <!-- ============================= -->

        <section class="card">

            <h2>Active Sessions</h2>

            <div id="sessions">
                No sessions
            </div>

        </section>



        <!-- ============================= -->
        <!-- ADD CLASS / SUBJECT -->
        <!-- ============================= -->

        <section class="card">

            <h2>Class & Subject Management</h2>

            <h3>Add Class / Subject</h3>

            <form id="courseForm">

                <input
                    type="text"
                    id="className"
                    placeholder="Class Name (e.g. III B.E CSE)"
                    required
                >

                <input
                    type="text"
                    id="courseCode"
                    placeholder="Subject Code (e.g. CS301)"
                    required
                >

                <input
                    type="text"
                    id="courseName"
                    placeholder="Subject Name (e.g. Computer Networks)"
                    required
                >

                <button
                    class="btn"
                    type="submit"
                >
                    Add Class / Subject
                </button>

            </form>

            <p id="courseMsg"></p>

        </section>



        <!-- ============================= -->
        <!-- ASSIGN ALL STUDENTS -->
        <!-- ============================= -->

        <section class="card">

            <h2>Student Enrollment</h2>

            <h3>Assign All Students to Class / Subject</h3>

            <form id="enrollmentForm">

                <select
                    id="enrollmentCourse"
                    required
                >
                    <option value="">
                        Select Class / Subject
                    </option>
                </select>

                <button
                    class="btn"
                    type="submit"
                >
                    Assign ALL Students
                </button>

            </form>

            <p id="enrollmentMsg"></p>

        </section>



        <!-- ============================= -->
        <!-- ATTENDANCE RECORDS -->
        <!-- ============================= -->

        <section class="card">

            <h2>Attendance Records</h2>

            <button
                id="exportBtn"
                class="btn"
                type="button"
            >
                Download Excel Ledger
            </button>

            <div id="records">
                No records
            </div>

        </section>


    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->

    <script src="/js/api.js"></script>

    <script src="/js/export.js"></script>

    <script src="/js/staff.js"></script>

</body>

</html>
